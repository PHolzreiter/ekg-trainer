name: Build
on:
  push:
    branches: [main]
    paths: ['server/**', 'web/**', 'engine/**']
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - {os: windows-latest, target: x86_64-pc-windows-msvc, name: EKG-Trainer-Windows.exe, bin: ekg-trainer.exe}
          - {os: macos-latest, target: aarch64-apple-darwin, name: EKG-Trainer-macOS-AppleSilicon, bin: ekg-trainer}
          - {os: macos-latest, target: x86_64-apple-darwin, name: EKG-Trainer-macOS-Intel, bin: ekg-trainer}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: EKG-Trainer-Linux, bin: ekg-trainer}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --manifest-path server/Cargo.toml
      - shell: bash
        run: cp server/target/${{ matrix.target }}/release/${{ matrix.bin }} "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}", path: "${{ matrix.name }}"}
