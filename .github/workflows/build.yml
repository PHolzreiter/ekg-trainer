name: Build
# Baut die Programme. Bei einem Tag v* entsteht zusätzlich ein Release mit Download-Dateien.
on:
  push:
    branches: [main]
    paths: ['server/**', 'web/**', 'engine/**', '.github/workflows/build.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release anlegen, z. B. v0.1.0 (leer = nur bauen)'
        required: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --manifest-path server/Cargo.toml
      - shell: bash
        run: cp server/target/release/ekg-trainer.exe EKG-Trainer.exe
      - uses: actions/upload-artifact@v4
        with: {name: EKG-Trainer-Windows, path: EKG-Trainer.exe}
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin --manifest-path server/Cargo.toml
      - run: cargo build --release --target x86_64-apple-darwin --manifest-path server/Cargo.toml
      - name: App zusammenbauen (Apple Silicon + Intel)
        run: |
          APP="EKG-Trainer.app"
          mkdir -p "$APP/Contents/MacOS"
          lipo -create -output "$APP/Contents/MacOS/ekg-trainer" \
            server/target/aarch64-apple-darwin/release/ekg-trainer \
            server/target/x86_64-apple-darwin/release/ekg-trainer
          chmod +x "$APP/Contents/MacOS/ekg-trainer"
          cp server/macos/Info.plist "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" EKG-Trainer-macOS.zip
      - uses: actions/upload-artifact@v4
        with: {name: EKG-Trainer-macOS, path: EKG-Trainer-macOS.zip}
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --manifest-path server/Cargo.toml
      - run: cp server/target/release/ekg-trainer ekg-trainer && tar czf EKG-Trainer-Linux.tar.gz ekg-trainer
      - uses: actions/upload-artifact@v4
        with: {name: EKG-Trainer-Linux, path: EKG-Trainer-Linux.tar.gz}
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true, path: dist}
      - env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version || github.ref_name }}
        run: gh release create "$VER" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EKG-Trainer $VER" --notes "Testversion. macOS und Windows sind nicht signiert und warnen beim ersten Start."
