name: Online-Räume
# Veröffentlicht den Cloudflare-Dienst für Online-Räume.
# Braucht zwei Repo-Secrets: CLOUDFLARE_API_TOKEN (Vorlage „Edit Cloudflare Workers“) und CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ['online/**', 'web/index.html', 'web/app.css', 'web/common.js', 'web/viewer.js']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teilnehmerseite übernehmen
        run: cp web/index.html web/app.css web/common.js web/viewer.js online/public/
      - name: Veröffentlichen
        working-directory: online
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
