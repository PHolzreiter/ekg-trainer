[package]
name = "ekg-trainer"
version = "0.1.0"
edition = "2021"
description = "EKG-Trainer: lokaler Host-Server (Steuerpult, Beamer, Teilnehmer im WLAN)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
serde_json = "1"
rust-embed = "8"
mime_guess = "2"
local-ip-address = "0.6"
rand = "0.8"
open = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
